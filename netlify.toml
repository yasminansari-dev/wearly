[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: serve index.html for any path that isn't a real file,
# so client-side routes and reloads don't 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed Vite assets are immutable — cache them aggressively.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
